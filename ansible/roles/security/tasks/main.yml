#  Infrastructure as Code (Ansible) deployment for Foxnet
#  Description:      Tasks for baseline hardening - UFW, fail2ban and sshd drop-in
#  Author:           Glen Charlton
#  Source:           https://github.com/bhradsky/foxnet
#  License:          See LICENCE.md in repository root
#  Use of AI:        Claude Opus 5.5 was used to assist the development of this code

---
- name: Install security packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
    state: present

- name: Harden sshd
  ansible.builtin.template:
    src: 10-foxnet-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-foxnet-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Allow SSH through UFW
  community.general.ufw:
    rule: limit
    port: "{{ security_ssh_port }}"
    proto: tcp
  when: security_ufw_enabled

- name: Allow RStudio Server from permitted networks
  community.general.ufw:
    rule: allow
    port: "{{ rstudio_port }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ rstudio_allowed_cidrs }}"
  when: security_ufw_enabled

- name: Enable UFW with default deny incoming
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: security_ufw_enabled

- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      port = {{ security_ssh_port }}
      backend = systemd
      maxretry = 5
      bantime = 1h
    owner: root
    group: root
    mode: "0644"
  when: security_fail2ban_enabled
  notify: Restart fail2ban

- name: Ensure fail2ban is running
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  when: security_fail2ban_enabled
